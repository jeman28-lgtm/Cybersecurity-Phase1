version: '3'
services:
  wiki:
    image: nginx
    ports:
      - "8080:80"
    networks:
      - frontend
      - backend
  db:
    image: mysql
    environment:
      MYSQL_ROOT_PASSWORD: securepassword
    networks:
      - backend  # Notice: No frontend network! It's isolated.

networks:
  frontend:
  backend:
